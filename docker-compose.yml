services:
  instagram-api:
    build: .
    container_name: instagram-food-map-api
    ports:
      - "8080:8080"
    volumes:
      # 持久化資料庫檔案
      - ./data:/app/data
      # 持久化 session 檔案
      - ./data/sessions:/home/appuser/.config/instaloader
    environment:
      - PYTHONPATH=/app
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-3.1-flash-lite}
      - ANALYZE_BATCH_SIZE=${ANALYZE_BATCH_SIZE:-10}
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - instagram-api
